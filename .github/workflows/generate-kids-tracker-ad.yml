name: Generate Kids Smart Tracker Ad

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install requests edge-tts

      - name: Generate the 30-second vertical MP4
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          if [ -z "$REPLICATE_API_TOKEN" ]; then
            echo "Missing secret REPLICATE_API_TOKEN. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          python scripts/generate_ad.py

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: kids-smart-tracker-ad-30s-9x16
          path: output/kids-smart-tracker-ad-30s-9x16.mp4
          if-no-files-found: error
          retention-days: 14
